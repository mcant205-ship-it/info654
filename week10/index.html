<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
</head>
<label for="randomnumber">Enter random number here</label>
    <input id="randomnumber" type="number" ><br>
    <button type="button" onclick="myfunction()">Enter</button>
    <h2 id="demo"></h2>

    <script>
    function myfunction() {
        let x = document.getelementbyid("randomnumber").value;
        document.getelementbyid("demo").innerHTML = "Great job, you entered this value: " + x;
    }
    </script>
</body>
</html>
