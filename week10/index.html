<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
</head>
<body>
    <label for="randomnumber">Enter a random number here:</label>
    <input id="randomnumber" type="number" ><br><br>
    <button type="button" onclick="myFunction()">Press me!</button>
    <h1 id="demo"></h1>

    <script>
    function myFunction() {
        let x = document.getElementById("randomnumber").value;
        document.getElementById("demo").innerHTML = "Great job, you entered this number: " + x;
    }
    </script>
</body>
</html>
